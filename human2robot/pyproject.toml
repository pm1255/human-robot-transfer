[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "human2robot-trajectory"
version = "0.1.0"
description = "Auditable RGB human motion to robot reference trajectories"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
vision = ["mediapipe==0.10.32", "opencv-contrib-python>=4.10,<5", "Pillow>=10"]
export = ["pyarrow>=18"]
render = ["mujoco==3.3.7", "opencv-python-headless>=4.10,<5", "trimesh==5.1.0", "pycollada==0.9.3", "fast-simplification==0.2.0", "numba==0.67.0"]
train = ["torch>=2.4", "h5py>=3.10", "opencv-python-headless>=4.10"]
test = ["pytest>=8"]

[project.scripts]
h2r = "h2r.cli:main"

[tool.setuptools.packages.find]
include = ["h2r*", "v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
